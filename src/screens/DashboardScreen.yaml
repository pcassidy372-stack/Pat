# =============================================================================
# DashboardScreen.yaml
# PowerApps Canvas App Screen — Mainframe Intake Dashboard (List / KPI View)
# =============================================================================

Screen: DashboardScreen
  Properties:
    Fill: =RGBA(245, 245, 245, 1)
    OnVisible: |
      =ClearCollect(
        colRequests,
        SortByColumns(
          'Mainframe Intake Requests',
          "Created",
          SortOrder.Descending
        )
       );
       // KPI counters
       Set(varTotalOpen,
         CountRows(Filter(colRequests, Status <> "Completed" && Status <> "Cancelled" && Status <> "Rejected"))
       );
       Set(varCritical,
         CountRows(Filter(colRequests, Priority = "Critical" && Status <> "Completed"))
       );
       Set(varAwaitingApproval,
         CountRows(Filter(colRequests, Status = "Under Review"))
       );
       Set(varCompletedThisMonth,
         CountRows(Filter(colRequests,
           Status = "Completed" &&
           Month(CompletionDate) = Month(Today()) &&
           Year(CompletionDate) = Year(Today())
         ))
       )

  Children:

    # ── Header Bar ──────────────────────────────────────────────────────
    - HeaderContainer:
        Control: GroupContainer
        Properties:
          X: 0
          Y: 0
          Width: =Parent.Width
          Height: 70
          Fill: =RGBA(0, 51, 102, 1)
        Children:
          - lblDashboardTitle:
              Control: Label
              Properties:
                Text: "Mainframe Intake Dashboard"
                Color: =Color.White
                Font: =Font.'Segoe UI'
                FontSize: 24
                FontWeight: =FontWeight.Bold
                X: 20
                Y: 15
                Width: 500
                Height: 40

          - lblUserGreeting:
              Control: Label
              Properties:
                Text: ="Welcome, " & User().FullName
                Color: =RGBA(200, 220, 255, 1)
                FontSize: 12
                X: =Parent.Width - 350
                Y: 10
                Width: 320
                Height: 25
                Align: =Align.Right

          - btnNewRequest:
              Control: Button
              Properties:
                Text: "+ New Request"
                X: =Parent.Width - 200
                Y: 18
                Width: 170
                Height: 38
                Fill: =RGBA(0, 120, 60, 1)
                Color: =Color.White
                RadiusTopLeft: 4
                RadiusTopRight: 4
                RadiusBottomLeft: 4
                RadiusBottomRight: 4
                OnSelect: |
                  =Set(varSelectedRequest, Blank());
                   Navigate(IntakeFormScreen, ScreenTransition.Fade)

    # ── KPI Cards Row ───────────────────────────────────────────────────
    - KpiContainer:
        Control: GroupContainer
        Properties:
          X: 20
          Y: 90
          Width: =Parent.Width - 40
          Height: 110
          LayoutMode: Horizontal
          LayoutGap: 20

        Children:
          - KpiOpenRequests:
              Control: GroupContainer
              Properties:
                Width: =(Parent.Width - 60) / 4
                Height: 100
                Fill: =Color.White
                RadiusTopLeft: 8
                RadiusTopRight: 8
                RadiusBottomLeft: 8
                RadiusBottomRight: 8
                DropShadow: =DropShadow.Light
              Children:
                - lblKpiOpenVal:
                    Control: Label
                    Properties:
                      Text: =Text(varTotalOpen)
                      FontSize: 32
                      FontWeight: =FontWeight.Bold
                      Color: =RGBA(0, 51, 102, 1)
                      X: 20
                      Y: 10
                      Width: 200
                      Height: 45
                - lblKpiOpenLabel:
                    Control: Label
                    Properties:
                      Text: "Open Requests"
                      FontSize: 12
                      Color: =RGBA(120, 120, 120, 1)
                      X: 20
                      Y: 58
                      Width: 200
                      Height: 25

          - KpiCritical:
              Control: GroupContainer
              Properties:
                Width: =(Parent.Width - 60) / 4
                Height: 100
                Fill: =Color.White
                RadiusTopLeft: 8
                RadiusTopRight: 8
                RadiusBottomLeft: 8
                RadiusBottomRight: 8
                DropShadow: =DropShadow.Light
              Children:
                - lblKpiCritVal:
                    Control: Label
                    Properties:
                      Text: =Text(varCritical)
                      FontSize: 32
                      FontWeight: =FontWeight.Bold
                      Color: =RGBA(200, 35, 35, 1)
                      X: 20
                      Y: 10
                      Width: 200
                      Height: 45
                - lblKpiCritLabel:
                    Control: Label
                    Properties:
                      Text: "Critical Priority"
                      FontSize: 12
                      Color: =RGBA(120, 120, 120, 1)
                      X: 20
                      Y: 58
                      Width: 200
                      Height: 25

          - KpiAwaitingApproval:
              Control: GroupContainer
              Properties:
                Width: =(Parent.Width - 60) / 4
                Height: 100
                Fill: =Color.White
                RadiusTopLeft: 8
                RadiusTopRight: 8
                RadiusBottomLeft: 8
                RadiusBottomRight: 8
                DropShadow: =DropShadow.Light
              Children:
                - lblKpiApprovalVal:
                    Control: Label
                    Properties:
                      Text: =Text(varAwaitingApproval)
                      FontSize: 32
                      FontWeight: =FontWeight.Bold
                      Color: =RGBA(230, 150, 0, 1)
                      X: 20
                      Y: 10
                      Width: 200
                      Height: 45
                - lblKpiApprovalLabel:
                    Control: Label
                    Properties:
                      Text: "Awaiting Approval"
                      FontSize: 12
                      Color: =RGBA(120, 120, 120, 1)
                      X: 20
                      Y: 58
                      Width: 200
                      Height: 25

          - KpiCompleted:
              Control: GroupContainer
              Properties:
                Width: =(Parent.Width - 60) / 4
                Height: 100
                Fill: =Color.White
                RadiusTopLeft: 8
                RadiusTopRight: 8
                RadiusBottomLeft: 8
                RadiusBottomRight: 8
                DropShadow: =DropShadow.Light
              Children:
                - lblKpiCompVal:
                    Control: Label
                    Properties:
                      Text: =Text(varCompletedThisMonth)
                      FontSize: 32
                      FontWeight: =FontWeight.Bold
                      Color: =RGBA(0, 120, 60, 1)
                      X: 20
                      Y: 10
                      Width: 200
                      Height: 45
                - lblKpiCompLabel:
                    Control: Label
                    Properties:
                      Text: "Completed This Month"
                      FontSize: 12
                      Color: =RGBA(120, 120, 120, 1)
                      X: 20
                      Y: 58
                      Width: 200
                      Height: 25

    # ── Filter / Search Bar ─────────────────────────────────────────────
    - FilterBar:
        Control: GroupContainer
        Properties:
          X: 20
          Y: 215
          Width: =Parent.Width - 40
          Height: 55
          Fill: =Color.White
          RadiusTopLeft: 8
          RadiusTopRight: 8
          RadiusBottomLeft: 8
          RadiusBottomRight: 8
          DropShadow: =DropShadow.Light
          LayoutMode: Horizontal

        Children:
          - txtSearch:
              Control: TextInput
              Properties:
                HintText: "Search by title, requestor, or ID..."
                X: 15
                Y: 8
                Width: 300
                Height: 38
                BorderColor: =RGBA(200, 200, 200, 1)
                RadiusTopLeft: 4
                RadiusTopRight: 4
                RadiusBottomLeft: 4
                RadiusBottomRight: 4
                OnChange: |
                  =ClearCollect(
                    colFiltered,
                    Filter(
                      colRequests,
                      txtSearch.Text in Title ||
                      txtSearch.Text in RequestorName ||
                      Text(ID) = txtSearch.Text
                    )
                  )

          - ddFilterStatus:
              Control: DropDown
              Properties:
                Items: |
                  =["All Statuses", "Draft", "Submitted", "Under Review",
                    "Approved", "In Progress", "On Hold",
                    "Completed", "Rejected", "Cancelled"]
                X: 330
                Y: 8
                Width: 180
                Height: 38

          - ddFilterPriority:
              Control: DropDown
              Properties:
                Items: =["All Priorities", "Critical", "High", "Medium", "Low"]
                X: 525
                Y: 8
                Width: 160
                Height: 38

          - ddFilterDept:
              Control: DropDown
              Properties:
                Items: |
                  =["All Departments", "Finance", "Operations",
                    "IT Infrastructure", "Application Development",
                    "Risk & Compliance", "HR", "Customer Service", "Other"]
                X: 700
                Y: 8
                Width: 180
                Height: 38

          - btnApplyFilter:
              Control: Button
              Properties:
                Text: "Apply"
                X: 900
                Y: 8
                Width: 90
                Height: 38
                Fill: =RGBA(0, 51, 102, 1)
                Color: =Color.White
                RadiusTopLeft: 4
                RadiusTopRight: 4
                RadiusBottomLeft: 4
                RadiusBottomRight: 4
                OnSelect: |
                  =ClearCollect(
                    colFiltered,
                    Filter(
                      colRequests,
                      // Status filter
                      (ddFilterStatus.Selected.Value = "All Statuses" ||
                       Status = ddFilterStatus.Selected.Value) &&
                      // Priority filter
                      (ddFilterPriority.Selected.Value = "All Priorities" ||
                       Priority = ddFilterPriority.Selected.Value) &&
                      // Department filter
                      (ddFilterDept.Selected.Value = "All Departments" ||
                       Department = ddFilterDept.Selected.Value) &&
                      // Text search
                      (IsBlank(txtSearch.Text) ||
                       txtSearch.Text in Title ||
                       txtSearch.Text in RequestorName)
                    )
                  )

    # ── Request List (Gallery) ──────────────────────────────────────────
    - galRequests:
        Control: Gallery
        Properties:
          Items: |
            =If(
              CountRows(colFiltered) > 0,
              colFiltered,
              colRequests
            )
          TemplateSize: 80
          TemplatePadding: 4
          X: 20
          Y: 285
          Width: =Parent.Width - 40
          Height: =Parent.Height - 310
          Fill: =Color.White
          RadiusTopLeft: 8
          RadiusTopRight: 8
          RadiusBottomLeft: 8
          RadiusBottomRight: 8
          DropShadow: =DropShadow.Light

        Children:
          - lblRowId:
              Control: Label
              Properties:
                Text: =Text(ThisItem.ID)
                X: 15
                Y: 8
                Width: 50
                Height: 30
                FontSize: 11
                Color: =RGBA(120, 120, 120, 1)

          - lblRowTitle:
              Control: Label
              Properties:
                Text: =ThisItem.Title
                X: 70
                Y: 5
                Width: 280
                Height: 30
                FontSize: 14
                FontWeight: =FontWeight.Semibold
                Color: =RGBA(0, 51, 102, 1)

          - lblRowRequestor:
              Control: Label
              Properties:
                Text: =ThisItem.RequestorName & " · " & ThisItem.Department
                X: 70
                Y: 35
                Width: 280
                Height: 25
                FontSize: 11
                Color: =RGBA(120, 120, 120, 1)

          - lblRowType:
              Control: Label
              Properties:
                Text: =ThisItem.RequestType
                X: 370
                Y: 8
                Width: 160
                Height: 25
                FontSize: 11

          - lblRowEnvironment:
              Control: Label
              Properties:
                Text: =ThisItem.MainframeEnvironment
                X: 370
                Y: 35
                Width: 160
                Height: 25
                FontSize: 11
                Color: =RGBA(120, 120, 120, 1)

          # Priority badge with color coding
          - btnRowPriority:
              Control: Button
              Properties:
                Text: =ThisItem.Priority
                X: 550
                Y: 12
                Width: 80
                Height: 28
                FontSize: 11
                Color: =Color.White
                RadiusTopLeft: 14
                RadiusTopRight: 14
                RadiusBottomLeft: 14
                RadiusBottomRight: 14
                Fill: |
                  =Switch(
                    ThisItem.Priority,
                    "Critical", RGBA(200, 35, 35, 1),
                    "High",     RGBA(230, 120, 0, 1),
                    "Medium",   RGBA(0, 120, 180, 1),
                    "Low",      RGBA(108, 117, 125, 1)
                  )
                DisplayMode: =DisplayMode.View

          # Status badge
          - btnRowStatus:
              Control: Button
              Properties:
                Text: =ThisItem.Status
                X: 650
                Y: 12
                Width: 110
                Height: 28
                FontSize: 11
                Color: =Color.White
                RadiusTopLeft: 14
                RadiusTopRight: 14
                RadiusBottomLeft: 14
                RadiusBottomRight: 14
                Fill: |
                  =Switch(
                    ThisItem.Status,
                    "Draft",          RGBA(108, 117, 125, 1),
                    "Submitted",      RGBA(0, 123, 255, 1),
                    "Under Review",   RGBA(230, 150, 0, 1),
                    "Approved",       RGBA(0, 120, 60, 1),
                    "In Progress",    RGBA(0, 150, 200, 1),
                    "On Hold",        RGBA(180, 100, 20, 1),
                    "Completed",      RGBA(40, 167, 69, 1),
                    "Rejected",       RGBA(200, 35, 35, 1),
                    "Cancelled",      RGBA(108, 117, 125, 1)
                  )
                DisplayMode: =DisplayMode.View

          - lblRowDate:
              Control: Label
              Properties:
                Text: =Text(ThisItem.Created, "mm/dd/yyyy")
                X: 780
                Y: 15
                Width: 100
                Height: 25
                FontSize: 11
                Color: =RGBA(120, 120, 120, 1)
                Align: =Align.Right

          # Chevron / tap target for detail navigation
          - icoRowChevron:
              Control: Icon
              Properties:
                Icon: =Icon.ChevronRight
                X: =Parent.TemplateWidth - 45
                Y: 20
                Width: 30
                Height: 30
                Color: =RGBA(180, 180, 180, 1)
                OnSelect: |
                  =Set(varSelectedRequest, ThisItem);
                   Navigate(RequestDetailScreen, ScreenTransition.Fade)
